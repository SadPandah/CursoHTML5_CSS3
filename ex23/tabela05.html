<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabela</title>
    <style>
        /* REVISITAR ESSA AULA tem tambem o trx*3>tdx X sendo a quantidade e o 3 sendo quantiade, ta nos comentarios, agora para outro caso Agrupando colunas com colgroup CursoEmVideo tem com cores no final*/

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        caption{
            font-size: 1em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 1px solid gray; 
            padding: 10px;

        }

        col.cnome{
            background-color: rgb(224, 174, 109);
        }
        
        col.cgrupo{
            background-color: red;
        }

    </style>
</head>
<body>
    <h1> Exercicio de Tabela </h1>

    <table>
        <colgroup> <!-- O colgroup serve para vc editar dentro de uma unica coluna , tipo aqui estou editando o NOMe por isso dei a class cnome-->
            <col class="cnome">
            <col class="cgrupo" span="2"> <!-- Aqui eu fiz apenas um grupo mesmo que tenha 4 eu posso fazer span 2 para avancar 2 colunas a partir deste grupo-->
            <col class="cprof">
        </colgroup>
        
        <caption>
            Cadastro
        </caption>


            <caption> Cadastro </caption>

</body>
</html>
